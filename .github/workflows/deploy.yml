name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_and_deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # action-hosting-deploy publishes the preview URL as a check run, which
      # needs checks:write. Without it the action 403s and dies *after* a
      # successful build — so a green build still reports the PR as failed.
      # Never surfaced before because the preview path had never run.
      checks: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Rendered in the app's More screen. Without it there is no way to
          # tell a phone running today's deploy from one still serving a
          # cached bundle, which has cost real time to guess at.
          NEXT_PUBLIC_BUILD: ${{ github.sha }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.NEXT_PUBLIC_GEMINI_API_KEY }}

      - name: Deploy to Firebase (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Deploy Preview (PR)
        if: github.event_name == 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}

  # Firestore rules are the golf app's only access control — the site is a
  # static export, so there is no server to check anything. Deploying them by
  # hand meant they could lag the app that depends on them, which fails in the
  # worst way: /golf loads, and every score write is silently refused.
  #
  # Deliberately a separate job rather than a step in the one above. The
  # hosting service account may not carry the Firebase Rules Admin role, and a
  # missing role should not be able to block the marketing site from shipping.
  # If this job fails, the site still deploys and the red check says exactly
  # what to fix.
  deploy_rules:
    name: Deploy Firestore Rules
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Names the principal that actually needs the role. Granting Firebase
      # Rules Admin to the wrong service account looks identical to granting it
      # to the right one — the deploy keeps failing with the same 403 — and
      # nothing in the log said which identity was being used.
      #
      # client_email and project_id are identifiers, not credentials; the
      # private key is never touched.
      - name: Identify deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          node -e '
            let sa;
            try {
              sa = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT || "{}");
            } catch {
              console.log("::error::FIREBASE_SERVICE_ACCOUNT is not valid JSON.");
              process.exit(1);
            }
            const target = process.env.FIREBASE_PROJECT_ID || "";
            console.log("Deploying as service account : " + (sa.client_email || "(none in key)"));
            console.log("Key belongs to project       : " + (sa.project_id || "(unknown)"));
            console.log("Deploy target project        : " + target);
            if (sa.project_id && target && sa.project_id !== target) {
              console.log("::warning::The key belongs to a different project than the deploy target.");
            }
            if (sa.client_email) {
              console.log(
                "::notice::If the next step fails with 403, grant roles/firebaserules.admin to " +
                sa.client_email
              );
            }
          '

      - name: Deploy rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT}" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set; cannot deploy firestore.rules."
            exit 1
          fi
          # Written outside the workspace so a stray build step can't sweep it
          # into the deployed artifact.
          printf '%s' "${FIREBASE_SERVICE_ACCOUNT}" > "${RUNNER_TEMP}/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="${RUNNER_TEMP}/sa.json"
          npx --yes firebase-tools@13 deploy \
            --only firestore:rules \
            --project "${FIREBASE_PROJECT_ID}" \
            --non-interactive
          rm -f "${RUNNER_TEMP}/sa.json"
